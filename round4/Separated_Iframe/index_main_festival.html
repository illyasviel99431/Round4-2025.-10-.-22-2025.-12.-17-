<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="keywords" content="" />
    <meta name="description" content="" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="shortcut icon" type="image/x-icon" href="resources/img/guide/favicon.ico">
    <link rel="icon" type="image/png" sizes="200x200" href="resources/img/guide/favicon_200.png">
    <link href="resources/css/swiper-bundle.min.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="resources/css/pattern.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>수원특례시청</title>
    <!-- <link href="resources/css/pattern.css" type="text/css" rel="stylesheet" /> -->
    <style>
        /* iframe 스타일링 */
        #header-frame,
        #footer-frame {
            width: 100%;
            border: none;
            display: block;
            overflow: hidden;
        }

        #header-frame {
            height: 300px;
            /* 헤더 높이에 맞게 조정 */
        }

        #footer-frame {
            height: 400px;
            /* 푸터 높이에 맞게 조정 */
        }


    </style>
    <script>
        // iframe 높이 자동 조절
        function resizeIframe(iframe) {
            iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
        }
    </script>
</head>

<body>
    <div id="wrap">

        <!-- 헤더 iframe -->
        <iframe id="header-frame" src="header.html" onload="resizeIframe(this)" scrolling="no"></iframe>

        <!-- 컨테이너 영역 -->
        <div id="container" style="height: 500px;">
            <div class="inner">
                <!-- 조영서 2025-12-13 : 매인 행사 축제 -->
                <!-- 행사와 축제 -->
                <div class="Slide-siez-wrapper">
                    <div class="card-badge"><img src="resources/img/my/행사 및 축제.jpg" alt="행사 및 축제"></div>
                    <div class="Slide-siez">
                        <div id="carouselExampleCaptions" class="carousel slide">

                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>

                            <div class="carousel-inner">
                                <a href="#">
                                    <div class="carousel-item active">
                                        <img loading="lazy"
                                            src="resources/img/수원시청.jpg"
                                            class="d-block w-100" alt="First slide">
                                        <div class="carousel-overlay" aria-hidden="true"></div>
                                        <div class="carousel-caption d-none d-md-block">
                                            <h5 class="caption-animate">시민과 함께하는 수원특례시</h5>
                                            <p class="caption-animate">시민 모두가 함께 즐기고 참여하는 다양한 문화 행사와 축제를 만나보세요.</p>
                                        </div>
                                    </div>
                                </a>
                                <a href="#">
                                    <div class="carousel-item">
                                        <img loading="lazy"
                                            src="resources/img/나무집.jpg"
                                            class="d-block w-100" alt="Second slide">
                                        <div class="carousel-overlay" aria-hidden="true"></div>
                                        <div class="carousel-caption d-none d-md-block">
                                            <h5 class="caption-animate">자연과 함께하는 특별한 하루</h5>
                                            <p class="caption-animate">푸른 자연 속에서 여유를 느끼고 소중한 추억을 만들어보세요.</p>

                                        </div>
                                    </div>
                                </a>
                                <a href="#">
                                    <div class="carousel-item">
                                        <img loading="lazy"
                                            src="resources/img/수원특례시.png"
                                            class="d-block w-100" alt="Third slide">
                                        <div class="carousel-overlay" aria-hidden="true"></div>
                                        <div class="carousel-caption d-none d-md-block">
                                            <h5 class="caption-animate">문화와 역사가 살아 숨 쉬는 수원</h5>
                                            <p class="caption-animate">수원의 역사와 전통을 느낄 수 있는 다채로운 축제와 문화 체험을 즐겨보세요.</p>

                                        </div>
                                    </div>
                            </div>
                            </a>
                            <button class="carousel-control-prev" type="button"
                                data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" type="button"
                                data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- //행사와 축제 -->
            </div>
        </div>

        <!-- 푸터 iframe -->
        <iframe id="footer-frame" src="footer.html" onload="resizeIframe(this)" scrolling="no"></iframe>
    </div>

    <!-- 스크립트 : 라이브러리 -->
    <script src="resources/js/pattern/jquery.min.js"></script>

    <!-- 스크립트 : 패턴 페이지 -->

    <script src="resources/js/pattern/ui-pattern-script.js"></script>


    <!-- 스크립트 : 컴포넌트 -->
    <script src="resources/js/component/ui-script.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
